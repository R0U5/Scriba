[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosetta-ai"
version = "1.0.0"
description = "Production-grade local audio transcription: paste a URL, get a transcript file. Runs state-of-the-art ASR models entirely on your own GPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RosettaAI" }]
keywords = ["asr", "transcription", "speech-to-text", "whisper", "parakeet", "canary", "local-ai"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
  # Everything needed to transcribe out of the box: a default install can do
  # the job without picking extras.
  "faster-whisper>=1.1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  "yt-dlp>=2024.4.9",
  "typer>=0.12",
  "rich>=13.7",
  "platformdirs>=4.2",
  "imageio-ffmpeg>=0.4.9",
  "numpy>=1.24",
]

[project.optional-dependencies]
# CUDA runtime libraries CTranslate2 loads for GPU inference. The launcher adds
# this automatically when it finds an NVIDIA GPU, so CPU-only machines are not
# made to download ~700 MB of CUDA for nothing.
cuda = [
  "nvidia-cublas-cu12>=12.3",
  "nvidia-cudnn-cu12>=9,<10",
]
# NVIDIA NeMo engines: Parakeet TDT v3 + Canary-Qwen 2.5B (the accuracy leaders).
# torch is listed explicitly so the CUDA index mapping below applies to it.
nvidia = ["torch>=2.4", "nemo_toolkit[asr]>=2.3.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "httpx>=0.27",
]
# Kept as an alias so older instructions keep working.
whisper = []

[project.urls]
Homepage = "https://github.com/R0U5/RosettaAI"
Repository = "https://github.com/R0U5/RosettaAI"

[project.scripts]
rosetta = "rosetta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rosetta"]

[tool.hatch.build.targets.sdist]
include = ["src/rosetta", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008", "E501"]
